[project]
name = "deep-swe-own"
version = "0.1.0"
description = "DeepSWE v1.1 on task images in your own Prime registry namespace (for Prime VMs)."
requires-python = ">=3.12"
# deep-swe comes from the Prime Hub index: prime env install primeintellect/deep-swe
dependencies = ["verifiers[harbor]>=0.3.1", "deep-swe"]
tags = ["multi-turn", "sandbox", "harbor", "swe", "v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deep_swe_own"]
