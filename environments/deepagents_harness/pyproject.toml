[project]
name = "deepagents-harness"
version = "0.1.0"
description = "A LangChain Deep Agents coding agent packaged as a verifiers v1 harness."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.3.1"]
tags = ["harness", "coding-agent", "deepagents", "langchain", "v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deepagents_harness"]
include = ["deepagents_harness/program.py"]
